name: CI Checks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # --------------------------------------------------
  # JOB 1: Kiểm tra Frontend (family-saga-io)
  # --------------------------------------------------
  frontend-check:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: family-saga-io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: family-saga-io/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Lint (nếu có script)
        run: npm run lint --if-present

      - name: Build Frontend
        run: npm run build

  # --------------------------------------------------
  # JOB 2: Kiểm tra Backend (nlp_family_extractor)
  # --------------------------------------------------
  backend-check:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nlp_family_extractor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: nlp_family_extractor/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Smoke test (Import FastAPI app)
        run: |
          python -c "from api import app; print('FastAPI app imported successfully!')"

      - name: Run Pytest (nếu có test suite)
        run: |
          if [ -d "tests" ] || [ -f "pytest.ini" ]; then pytest; else echo "No tests found, skipping."; fi