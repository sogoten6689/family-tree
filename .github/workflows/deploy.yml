name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: family-saga-io/package-lock.json

      - name: Build frontend
        working-directory: family-saga-io
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend deps check
        working-directory: nlp_family_extractor
        run: |
          pip install -r requirements.txt
          python -c "import api"

