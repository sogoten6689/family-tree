version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: family-tree-nginx
    ports:
      - "87:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./family-saga-io
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
    container_name: family-tree-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./nlp_family_extractor
      dockerfile: Dockerfile
    container_name: family-tree-backend
    ports:
      - "8002:8000"
    volumes:
      - ./nlp_family_extractor/data:/app/data
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: family_tree
      MYSQL_USER: family_user
      MYSQL_PASSWORD: family_password
      JWT_SECRET_KEY: dev-secret-change-in-production
      ADMIN_EMAIL: admin@giapha.com
      ADMIN_PASSWORD: Admin@123456
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9002
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: family-tree-docs
      MINIO_USE_SSL: "false"
      MINIO_AUTO_CREATE_BUCKET: "true"
      HANNOM_API_BASE_URL: https://kimhannom.fit.hcmus.edu.vn
      HANNOM_RATE_LIMIT_PER_MINUTE: "40"
      HANNOM_OCR_ID: "1"
      HANNOM_OCR_LANG_TYPE: "0"
      HANNOM_FONT_TYPE: "1"
      HANNOM_TRANSLITERATION_LANG_TYPE: "1"
      HANNOM_EMAIL: ${HANNOM_EMAIL:-}
      HANNOM_PASSWORD: ${HANNOM_PASSWORD:-}
      # Hoặc token tĩnh / token lấy runtime qua /api/developer/hannom/fetch-token
      HANNOM_API_TOKEN: ${HANNOM_API_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: family-tree-minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: family-tree-mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: family_tree
      MYSQL_USER: family_user
      MYSQL_PASSWORD: family_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data:
