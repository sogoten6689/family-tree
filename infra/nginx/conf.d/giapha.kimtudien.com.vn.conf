server {
    listen 80;
    server_name giapha.kimtudien.com.vn;

    # Upload tài liệu / OCR — backend cho phép tới 50MB (MINIO_MAX_UPLOAD_BYTES)
    client_max_body_size 55m;

    # ── Backend: API + docs ──────────────────────────────────────────
    location ~ ^/(api|docs|redoc|openapi\.json|health) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 55m;
        proxy_request_buffering off;
    }

    # ── MinIO S3 API qua tiền tố /minio/ ─────────────────────────────
    # KHÔNG dùng cho presigned URL: tiền tố bị cắt → chữ ký sai. Link tạm đi qua
    # location /family-tree-docs/ bên dưới.
    location /minio/ {
        proxy_pass         http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 300;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        client_max_body_size  55m;
        chunked_transfer_encoding off;
    }

    # ── MinIO: link tạm (presigned) cho ảnh/tài liệu ─────────────────
    # Backend ký link với MINIO_PUBLIC_ENDPOINT=https://giapha.kimtudien.com.vn
    # (đặt trong Jenkinsfile) → URL dạng /<bucket>/<key>?X-Amz-…. Chữ ký S3 phụ
    # thuộc Host + ĐƯỜNG DẪN, nên ở đây proxy_pass KHÔNG có URI (giữ nguyên
    # đường dẫn) và giữ Host. /minio/ ở trên cắt tiền tố → chữ ký sai (403
    # SignatureDoesNotMatch, đã thử 02/10/2026). Không có chữ ký → MinIO 403.
    location /family-tree-docs/ {
        proxy_pass         http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    # ── Frontend: SPA ────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}