server {
    listen 80;
    server_name giapha.kimtudien.com.vn;

    # Upload tài liệu / OCR — backend cho phép tới 50MB (MINIO_MAX_UPLOAD_BYTES)
    client_max_body_size 55m;

    # ── Backend: API + docs ──────────────────────────────────────────
    location ~ ^/(api|docs|redoc|openapi\.json|health) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 55m;
        proxy_request_buffering off;
    }

    # ── MinIO S3 API (presigned URL / tải file) ───────────────────────
    # Production: MINIO_PUBLIC_ENDPOINT=http://giapha.kimtudien.com.vn/minio
    location /minio/ {
        proxy_pass         http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 300;
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        client_max_body_size  55m;
        chunked_transfer_encoding off;
    }

    # ── Frontend: SPA ────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}